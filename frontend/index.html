<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="version" content="__SUB_STORE_FRONT_END_VERSION__">
  <!-- <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" /> -->
  <meta http-equiv="Expires" content="0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Sub Store</title>
  <meta name="description" content="Cloudflare-native subscription aggregation and routing templates" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon.ico" type="image/png" sizes="16x16" />
  <link rel="mask-icon" href="/favicon.svg" color="#FFFFFF" />
  <!-- Before the app boots the scheme comes from the OS; useThemes then
       rewrites every theme-color tag to the theme the account actually uses. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8FAFC" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090B" />
  <!-- Text uses the platform UI and mono faces: nothing is downloaded and the
       Worker CSP stays self-only. -->
  <style>
    html {
      width: 100%;
      /* dvh tracks the URL bar as it collapses; vh is the pre-dvh fallback. */
      height: 100vh;
      height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      background: #f8fafc;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #09090b;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div style='z-index:9999;position: relative' id='ztop'></div>
  <script type="module" async src="/src/main.ts"></script>
  <noscript>
    <strong>Sub Store requires JavaScript. Please enable it and reload this page.</strong>
  </noscript>
</body>

</html>
