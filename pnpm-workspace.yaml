packages:
  - frontend
  - cloudflare
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: true
ignoredBuiltDependencies:
  - '@playwright/test'
  - playwright
  - playwright-core
minimumReleaseAgeExclude:
  - '@cloudflare/vitest-pool-workers@0.18.4'
  - '@cloudflare/workers-types@5.20260710.1'
  - miniflare@4.20260708.1
  - wrangler@4.110.0
# These entries let `pnpm install` resolve freshly published versions. They do
# not exempt a committed lockfile from the supply-chain verification pass, so
# only commit tooling versions that are at least a day old — otherwise
# `pnpm install --frozen-lockfile` fails with
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION.
# Security floors for transitive dependencies that only ship through other
# packages (Vue's compiler-sfc pulls postcss, postcss pulls nanoid, minimatch
# pulls brace-expansion). The selectors keep the patched major lines only, so
# older lines that other consumers still need are untouched.
overrides:
  brace-expansion@5: 5.0.12
  nanoid@3: 3.3.19
  '@vue/compiler-sfc>postcss': 8.5.28
  # `miniflare@5.20260815.0-alpha` (pinned by @cloudflare/vitest-pool-workers)
  # depends on sharp 0.35.2 exactly; 0.35.4 is the patch release the newer
  # miniflare ships.
  sharp@0.35: 0.35.4
