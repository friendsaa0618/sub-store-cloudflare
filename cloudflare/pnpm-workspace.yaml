allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
# `minimumReleaseAgeExclude` entries let `pnpm install` resolve freshly
# published versions, but they do not exempt a committed lockfile from the
# supply-chain verification pass — only commit tooling versions that are at
# least a day old, or `pnpm install --frozen-lockfile` fails with
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION.
overrides:
  # `miniflare@5.20260815.0-alpha` (pinned by @cloudflare/vitest-pool-workers)
  # depends on sharp 0.35.2 exactly; 0.35.4 is the patch release the newer
  # miniflare ships.
  sharp@0.35: 0.35.4